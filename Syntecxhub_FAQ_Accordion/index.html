<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ_Accordion</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="faq">
        <h1>Frequently Asked Questions</h1>

        <div class="faq-item">
            <button class="faq-question">What is HTML?</button>
            <div class="faq-answer">
                <p>HTML is the standard language used to structure web pages.</p>
            </div>
        </div>

        <div class="faq-item">
            <button class="faq-question">What is CSS?</button>
            <div class="faq-answer">
                <p>CSS is used to style and layout web pages.</p>
            </div>
        </div>

        <div class="faq-item">
            <button class="faq-question">What is JavaScript?</button>
            <div class="faq-answer">
                <p>JavaScript adds interactivity and logic to web pages.</p>
            </div>
        </div>

    </main>

    <script src="script.js"></script>
</body>

</html>
